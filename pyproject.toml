[project]
name = "chess-sandbox"
version = "0.1.0"
description = "Local chess sandbox: free-form position editor, play vs Stockfish, recognize positions from screenshots"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-chess>=1.999",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "cairosvg>=2.7",
    "requests>=2.31",
    "zstandard>=0.22",
    "httpx>=0.27",
]

[project.optional-dependencies]
recognize = [
    "torch>=2.2",
    "torchvision>=0.17",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend" = ["data/*.txt.gz", "data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
ignore_missing_imports = true
