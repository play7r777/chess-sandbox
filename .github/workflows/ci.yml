name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff & mypy
        run: pip install ruff==0.5.* mypy==1.10.*
      - name: ruff
        run: ruff check backend/
      - name: mypy
        run: mypy --ignore-missing-imports backend/
